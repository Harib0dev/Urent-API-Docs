          example: 55.7558
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 37.6173
      - name: locationLat
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 55.7558
      - name: locationLng
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 37.6173
