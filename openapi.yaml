    get:
      summary: Погода (обнаружено в трафике)
      operationId: getWeather
      tags:
      - Misc
      security: []
      parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
          example: ru_RU
      - name: lat
        in: path
        required: true
        schema:
          type: string
          example: '55.65'
      - name: lng
        in: path
        required: true
        schema:
          type: string
          example: '37.75'
      - name: units
        in: query
        required: false
        schema:
          type: string
          example: m
      - name: include
        in: query
        required: false
        schema:
          type: string
