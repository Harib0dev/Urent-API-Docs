  /ws:
    get:
      summary: WebSocket подключение (realtime)
      operationId: connectRealtimeWebSocket
      tags:
      - Realtime
      security: []
      servers:
      - url: https://notification.service.urentbike.ru
        description: Observed notification WebSocket host
      parameters:
      - name: authtoken
        in: query
        required: true
        schema:
          type: string
          description: JWT (как query параметр)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: >-
        Наблюдалось подключение вида `/ws?authtoken=<JWT>` и WebSocket upgrade
        на notification-хосте. Формат сообщений зависит от клиента/версии и не
        стандартизирован в OpenAPI.
      x-websocket: true
