openapi: 3.1.0
info:
  title: Urent API (Unofficial, Reverse-Engineered)
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit/
  description: '⚠️ Неофициальная спецификация API Urent, составленная на основе анализа
    сетевого трафика мобильного приложения и пользовательских логов.


    - Базовый REST-шлюз: `https://app.urentbike.ru/gatewayclient/api`

    - Авторизация: `Authorization: Bearer <JWT>` (RS256), issuer наблюдался: `https://service.urentbike.ru/identity`

    - Клиент использует дополнительные заголовки `ur-*` и подпись `ur-request-data`
    (алгоритм подписи намеренно не описывается).


    **Важно:** эта спецификация предназначена для документирования наблюдаемого поведения.
    Эндпоинты/поля могут отличаться в разных регионах/версиях приложения.

    '
externalDocs:
  description: Swagger UI
  url: https://harib0dev.github.io/Urent-API-Docs/
x-documentation:
  source: reverse-engineered traffic observations
  safetyNote: Request signing algorithm and bypass techniques are intentionally undocumented.
  schemaPolicy: Unknown response fields are kept via additionalProperties until confirmed.
servers:
- url: https://app.urentbike.ru/gatewayclient/api
  description: Production Gateway (observed)
security:
- bearerAuth: []
tags:
- name: Rental
  description: Аренда и управление поездкой
- name: Transports
  description: Поиск и информация о транспорте
- name: Zones
  description: Зоны и геолокация
- name: Profile
  description: Профиль пользователя
- name: Payments
  description: Платежи и карты
- name: Subscriptions
  description: Подписки и пакеты минут
- name: Powerbank
  description: Повербанки
- name: Auth
  description: Авторизация и токены
- name: Devices
  description: Устройства и push-токены
- name: Feedback
  description: Оценки и обратная связь
- name: Files
  description: Статические файлы приложения
- name: FeatureFlags
  description: Флаги функций и эксперименты
- name: Telemetry
  description: Клиентская телеметрия
- name: Misc
  description: Прочие эндпоинты
- name: Realtime
  description: WebSocket / realtime (через расширения)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT (наблюдался RS256).
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: ru
      description: Язык клиента.
    UserAgent:
      name: User-Agent
      in: header
      required: false
      schema:
        type: string
        example: UrentApp/1.91.0 (iOS)
      description: User-Agent мобильного приложения.
    UrLatitude:
      name: ur-latitude
      in: header
      required: false
      schema:
        type: number
        format: double
        example: 55.7558
      description: Широта устройства (клиентский контекст).
    UrLongitude:
      name: ur-longitude
      in: header
      required: false
      schema:
        type: number
        format: double
        example: 37.6173
      description: Долгота устройства (клиентский контекст).
    UrDeviceRegion:
      name: ur-device-region
      in: header
      required: false
      schema:
        type: string
        example: RU
      description: Регион устройства.
    UrTimeZone:
      name: ur-time-zone
      in: header
      required: false
      schema:
        type: string
        example: GMT+3
      description: Часовой пояс устройства.
    UrRequestVersion:
      name: ur-request-version
      in: header
      required: false
      schema:
        type: string
        example: v2
      description: Версия клиентского протокола (наблюдалась `v2`).
    UrRequestData:
      name: ur-request-data
      in: header
      required: false
      schema:
        type: string
        example: 89D026A8BA79...
      description: Подпись запроса (хеш/сигнатура). Алгоритм подписи не описывается.
    EnvironmentInfo:
      name: environment-info
      in: header
      required: false
      schema:
        type: string
        example: '{"device":"iPhone"}'
      description: Служебная информация окружения (часто JSON-строка).
  schemas:
    ObservedMetadata:
      type: object
      description: Метаданные наблюдения. Это расширение документации, а не поле API.
      properties:
        appVersion:
          type: string
          example: 1.91.0
        platform:
          type: string
          enum:
          - ios
          - android
          - unknown
        region:
          type: string
          example: RU
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type:
          - string
          - integer
      additionalProperties: true
    OrderMakeRequest:
      type: object
      required:
      - scooter_id
      - tariff_id
      - latitude
      - longitude
      properties:
        scooter_id:
          type: string
          example: S.123
        tariff_id:
          type: string
          example: basic
        latitude:
          type: number
          format: double
          example: 55.7558
        longitude:
          type: number
          format: double
          example: 37.6173
    OrderMakeResponse:
      type: object
      properties:
        order_id:
          type: string
          example: ORD12345
        status:
          type: string
          example: created
        start_time:
          type: string
          format: date-time
      additionalProperties: true
    OrderIdRequest:
      type: object
      required:
      - order_id
      properties:
        order_id:
          type: string
          example: ORD12345
    OrderEndResponse:
      type: object
      properties:
        order_id:
          type: string
        status:
          type: string
          example: ended
        total_cost:
          type: number
          example: 150.0
        currency:
          type: string
          example: RUB
      additionalProperties: true
    Transport:
      type: object
      description: Наблюдаемая модель транспорта. Реальный ответ может содержать дополнительные поля модели, статуса и тарифа.
      properties:
        scooter_id:
          type: string
          example: S.123
        id:
          type: string
          example: S.123
        name:
          type: string
          example: '123'
        latitude:
          type: number
          format: double
          example: 55.7558
        longitude:
          type: number
          format: double
          example: 37.6173
        type:
          type: string
          example: scooter
        model:
          type: string
          example: scooter
        battery_level:
          type: integer
          minimum: 0
          maximum: 100
          example: 87
      additionalProperties: true
    TransportModel:
      type: object
      properties:
        id:
          type:
          - string
          - integer
          example: scooter_basic
        name:
          type: string
          example: Scooter
        type:
          type: string
          example: scooter
      additionalProperties: true
    GeoPoint:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 55.7558
        longitude:
          type: number
          format: double
          example: 37.6173
    City:
      type: object
      properties:
        id:
          type:
          - string
          - integer
          example: 1
        name:
          type: string
          example: Москва
        country:
          type: string
          example: RU
      additionalProperties: true
    Zone:
      type: object
      description: Геозона или ограничение на карте. Геометрия и свойства могут отличаться по типу зоны.
      properties:
        id:
          type:
          - string
          - integer
          example: zone_1
        name:
          type: string
          example: Rental zone
        type:
          type: string
          example: rent
        color:
          type: string
          example: '#00AA66'
        geometry:
          type: object
          additionalProperties: true
      additionalProperties: true
    PaymentOperation:
      type: object
      properties:
        id:
          type: string
          example: op_123
        amount:
          type: number
          example: 150
        currency:
          type: string
          example: RUB
        status:
          type: string
          example: success
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Profile:
      type: object
      properties:
        id:
          type:
          - string
          - integer
          example: user_123
        phone:
          type: string
          description: Маскируйте реальное значение в публичных примерах.
          example: '+70000000000'
        name:
          type: string
          example: User
        email:
          type: string
          format: email
          example: user@example.com
      additionalProperties: true
    ReferralInfo:
      type: object
      properties:
        code:
          type: string
          example: ABC123
        invited_count:
          type: integer
          minimum: 0
          example: 0
      additionalProperties: true
    CashbackBalance:
      type: object
      properties:
        balance:
          type: number
          example: 0
        currency:
          type: string
          example: RUB
      additionalProperties: true
    PaymentOptionsResponse:
      type: object
      properties:
        availableLinkCard:
          type: boolean
        enableBankCardVerification:
          type: boolean
        recurringAps:
          type: array
          items:
            type: string
        replenishmentAps:
          type: array
          items:
            type: string
      additionalProperties: true
    Card:
      type: object
      properties:
        card_id:
          type: string
          example: card_123
        last4:
          type: string
          example: '1234'
        brand:
          type: string
          example: visa
        is_default:
          type: boolean
      additionalProperties: true
    PowerbankStation:
      type: object
      properties:
        id:
          type: string
          example: station_123
        latitude:
          type: number
          format: double
          example: 55.7558
        longitude:
          type: number
          format: double
          example: 37.6173
        available_powerbanks:
          type: integer
          minimum: 0
          example: 4
        free_slots:
          type: integer
          minimum: 0
          example: 8
      additionalProperties: true
    ApiEnvelope:
      type: object
      description: Обёртка ответа, часто встречающаяся в наблюдаемом трафике.
      properties:
        succeeded:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    Money:
      type: object
      properties:
        value:
          type: number
          example: 150
        value100:
          type: integer
          example: 15000
        valueFormatted:
          type: string
          example: 150 ₽
        valueFormattedWithoutZero:
          type: string
          example: 150 ₽
        culture:
          type: string
          example: ru-RU
      additionalProperties: true
    IdentifierLocationRequest:
      type: object
      required:
      - Identifier
      properties:
        Identifier:
          type: string
          example: ORD12345
        locationLat:
          type: number
          format: double
          example: 55.7558
        locationLng:
          type: number
          format: double
          example: 37.6173
      additionalProperties: true
    DeviceTokenRequest:
      type: object
      required:
      - deviceToken
      - deviceUniqueId
      properties:
        deviceToken:
          type: string
          description: Push-токен устройства. В публичных примерах должен быть заменён.
          example: push_token_redacted
        deviceUniqueId:
          type: string
          description: Идентификатор устройства. В публичных примерах должен быть заменён.
          example: device_id_redacted
        messagingApiType:
          type: string
          example: apns
        locationLat:
          type: number
          format: double
          example: 55.7558
        locationLng:
          type: number
          format: double
          example: 37.6173
      additionalProperties: true
    ConnectTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token. Не публикуйте реальные значения.
          example: redacted.jwt.token
        refresh_token:
          type: string
          description: Refresh token. Не публикуйте реальные значения.
          example: refresh_token_redacted
        expires_in:
          type: integer
          example: 3600
        token_type:
          type: string
          example: Bearer
        scope:
          type: string
          example: offline_access
      additionalProperties: true
    RateInfoResponse:
      type: object
      properties:
        succeeded:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        transportId:
          type: string
          example: S.123
        userAccountId:
          type: string
          example: user_123
        withInsurance:
          type: boolean
        rate:
          type: object
          properties:
            id:
              type: string
              example: basic
            displayName:
              type: string
              example: Стандартный
            rateType:
              type: string
              example: per_minute
            periodMinute:
              type: integer
              example: 1
            debit:
              $ref: '#/components/schemas/Money'
            activationCost:
              $ref: '#/components/schemas/Money'
            insuranceCost:
              $ref: '#/components/schemas/Money'
          additionalProperties: true
      additionalProperties: true
    OrderActionResponse:
      type: object
      description: Ответ на действия с активным заказом. В реальном ответе много вложенных полей заказа и activity.
      properties:
        succeeded:
          type: boolean
          example: true
        result:
          type: string
          example: success
        type:
          type: string
          example: order
        activity:
          type: object
          additionalProperties: true
        order:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    OrderInfoResponse:
      type: object
      properties:
        succeeded:
          type: boolean
          example: true
        orderId:
          type: string
          example: ORD12345
        transportIdentifier:
          type: string
          example: S.123
        rateName:
          type: string
          example: Стандартный
        rateType:
          type: string
          example: per_minute
        summaryWithdrawn:
          $ref: '#/components/schemas/Money'
        rateWithdrawn:
          $ref: '#/components/schemas/Money'
        activation:
          $ref: '#/components/schemas/Money'
      additionalProperties: true
    ProfileAggregatedResponse:
      type: object
      properties:
        statisticsTripCount:
          type: integer
          example: 10
        userRatingValue:
          type: number
          example: 4.9
        verificationStatusString:
          type: string
          example: verified
        isSubscriptionActive:
          type: boolean
        subscriptionName:
          type: string
          example: Premium
      additionalProperties: true
    VehicleFeedbackOption:
      type: object
      properties:
        priority:
          type: integer
          example: 1
        vehicleOverallRating:
          type: object
          properties:
            key:
              type: string
              example: good
            value:
              type: string
              example: Хорошо
          additionalProperties: true
        availableOptions:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    FlagrEvaluationBatchRequest:
      type: object
      properties:
        entities:
          type: array
          items:
            type: object
            properties:
              entityID:
                type: string
                example: user_redacted
              entityContext:
                type: object
                additionalProperties: true
            additionalProperties: true
        flagKeys:
          type: array
          items:
            type: string
          example:
          - example_flag
      additionalProperties: true
    FlagrEvaluationBatchResponse:
      type: object
      properties:
        evaluationResults:
          type: array
          items:
            type: object
            properties:
              flagID:
                type: integer
              flagKey:
                type: string
              flagSnapshotID:
                type: integer
              timestamp:
                type: string
                format: date-time
              evalContext:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    TelemetryEvent:
      type: object
      description: Клиентское событие логирования. Наблюдаемые payload могут содержать персональные поля; реальные значения нельзя публиковать.
      properties:
        action:
          type: string
        app_version:
          type: string
          example: 1.80.0
        app_build_number:
          type: string
          example: '7'
        facility:
          type: string
        level:
          type: integer
        message:
          type: string
        user_id:
          type: string
          description: Должен быть обезличен.
          example: user_redacted
        session_id:
          type: string
          description: Должен быть обезличен.
          example: session_redacted
      additionalProperties: true
    PromocodeRequest:
      type: object
      required:
      - promocode
      properties:
        promocode:
          type: string
          example: FREE2025
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /v1/order/make:
    post:
      summary: Старт аренды (создать заказ)
      operationId: createRentalOrder
      tags:
      - Rental
      parameters:
      - &id001
        $ref: '#/components/parameters/AcceptLanguage'
      - &id002
        $ref: '#/components/parameters/UserAgent'
      - &id003
        $ref: '#/components/parameters/UrLatitude'
      - &id004
        $ref: '#/components/parameters/UrLongitude'
      - &id005
        $ref: '#/components/parameters/UrDeviceRegion'
      - &id006
        $ref: '#/components/parameters/UrTimeZone'
      - &id007
        $ref: '#/components/parameters/UrRequestVersion'
      - &id008
        $ref: '#/components/parameters/UrRequestData'
      - &id009
        $ref: '#/components/parameters/EnvironmentInfo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderMakeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Создаёт заказ на старт аренды. На практике сервер сверяет координаты
        из body/query и заголовков `ur-latitude/ur-longitude` и может требовать `ur-request-data`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderMakeRequest'
            examples:
              example:
                value:
                  scooter_id: S.123
                  tariff_id: basic
                  latitude: 55.7558
                  longitude: 37.6173
  /v1/order/end:
    post:
      summary: Завершить аренду
      operationId: endRentalOrder
      tags:
      - Rental
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEndResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'
  /v1/orders/wait:
    post:
      summary: Пауза аренды
      operationId: pauseRentalOrder
      tags:
      - Rental
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'
  /v1/orders/continue:
    post:
      summary: Продолжить аренду (снять с паузы)
      operationId: continueRentalOrder
      tags:
      - Rental
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'
  /v2/order/photo:
    post:
      summary: Загрузить фото после завершения поездки
      operationId: uploadOrderPhoto
      tags:
      - Rental
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - order_id
              - photo
              properties:
                order_id:
                  type: string
                  example: ORD12345
                photo:
                  type: string
                  format: binary
  /v6/transports:
    get:
      summary: Поиск транспорта в радиусе
      operationId: listTransports
      tags:
      - Transports
      parameters:
      - name: includeEmptyParkings
        in: query
        required: true
        schema:
          type: boolean
          example: true
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 55.7558
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 37.6173
      - name: locationLat
        in: query
        required: true
        schema:
          type: number
