name: OpenAPI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Validate OpenAPI structure
        run: python scripts/validate_openapi.py

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint openapi.yaml
